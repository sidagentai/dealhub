spring:
  application:
    name: dealhub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dealhub}
    username: ${DB_USERNAME:dealhub}
    password: ${DB_PASSWORD:dealhub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
